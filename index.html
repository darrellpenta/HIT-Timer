<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HIT Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #15151a;
  --surface-2: #1f1f25;
  --border: #2c2c34;
  --border-bright: #3d3d46;
  --text: #f5f1e8;
  --muted: #b4b4bc;
  --dim: #8a8a92;
  --work: #fbbf24;
  --work-soft: rgba(251, 191, 36, 0.12);
  --rest: #4ad8c4;
  --rest-soft: rgba(74, 216, 196, 0.12);
  --alert: #ff3a2d;
  --alert-soft: rgba(255, 58, 45, 0.18);
  --display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --body: 'DM Sans', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--work); outline-offset: 2px; border-radius: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

/* ===== Shared layout ===== */
.screen {
  flex: 1; display: flex; flex-direction: column;
  padding: 22px 18px;
  max-width: 520px; margin: 0 auto; width: 100%;
}
.app-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.app-header .back {
  font-family: var(--mono); font-size: 0.72rem;
  letter-spacing: 0.15em; color: var(--muted);
  background: none; border: none; cursor: pointer;
  text-transform: uppercase;
  padding: 6px 4px;
}
.app-header .title {
  font-family: var(--display); font-weight: 900;
  font-size: 1.5rem; line-height: 1;
  text-transform: uppercase;
  letter-spacing: 0.01em;
}
.app-header .right { font-family: var(--mono); font-size: 0.7rem; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

/* ===== Buttons ===== */
.btn {
  font-family: var(--display); font-weight: 800;
  letter-spacing: 0.05em; text-transform: uppercase;
  font-size: 1rem;
  padding: 14px 18px;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border-bright);
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px;
  min-height: 52px;
  width: 100%;
  transition: transform 0.08s ease, background 0.15s ease;
}
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--work); color: #1a1408; border-color: var(--work); }
.btn.rest { background: var(--rest); color: #08201d; border-color: var(--rest); }
.btn.ghost { background: transparent; border-color: var(--border); color: var(--muted); }
.btn.danger { background: transparent; color: var(--alert); border-color: var(--alert); }
.btn.danger.armed { background: var(--alert); color: #1a0a08; animation: armPulse 0.5s ease-in-out infinite alternate; }
@keyframes armPulse { from { opacity: 1; } to { opacity: 0.65; } }
.btn.small { font-size: 0.85rem; padding: 10px 14px; min-height: 42px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ===== Home screen ===== */
.brand {
  font-family: var(--display); font-weight: 900;
  font-size: 2.4rem; line-height: 0.95;
  letter-spacing: -0.01em; text-transform: uppercase;
  margin-bottom: 4px;
}
.brand .accent { color: var(--work); }
.tagline {
  font-family: var(--mono); font-size: 0.7rem;
  color: var(--dim); letter-spacing: 0.15em;
  text-transform: uppercase; margin-bottom: 28px;
}
.mode-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 18px 18px;
  cursor: pointer;
  text-align: left;
  width: 100%;
  color: inherit;
  font: inherit;
  position: relative;
  transition: border-color 0.15s ease, transform 0.08s ease;
}
.mode-card:active { transform: scale(0.99); }
.mode-card:hover { border-color: var(--border-bright); }
.mode-card .label {
  font-family: var(--mono); font-size: 0.68rem;
  letter-spacing: 0.2em; font-weight: 800;
  text-transform: uppercase;
}
.mode-card .label.work { color: var(--work); }
.mode-card .label.rest { color: var(--rest); }
.mode-card .label.builder { color: #c084fc; }
.mode-card .name {
  font-family: var(--display); font-weight: 800;
  font-size: 1.6rem; line-height: 1;
  text-transform: uppercase;
  margin-top: 6px;
}
.mode-card .desc {
  font-size: 0.85rem; color: var(--muted);
  margin-top: 8px; line-height: 1.4;
}
.mode-card .arrow {
  position: absolute; right: 16px; top: 50%;
  transform: translateY(-50%);
  color: var(--dim);
  font-size: 1.4rem;
}

/* ===== HIT Coach styles ===== */
.day-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px 16px 12px;
}
.day-card .day-info { margin-bottom: 12px; }
.day-card .day-num {
  font-family: var(--mono); font-weight: 800;
  font-size: 0.68rem; color: var(--work);
  letter-spacing: 0.2em;
}
.day-card .day-title {
  font-family: var(--display); font-weight: 800;
  font-size: 1.5rem; line-height: 1;
  text-transform: uppercase;
  margin-top: 4px;
}
.day-card .day-meta {
  font-size: 0.78rem; color: var(--muted);
  margin-top: 6px;
}
.day-card .day-actions {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin-top: 4px;
}

.block-row {
  display: flex; align-items: center; padding: 12px 0;
  border-bottom: 1px dashed var(--border);
  gap: 10px;
}
.block-row:last-child { border-bottom: none; }
.block-num { font-family: var(--mono); font-weight: 700; font-size: 0.85rem; color: var(--dim); width: 24px; }
.block-info { flex: 1; min-width: 0; }
.block-name {
  font-family: var(--display); font-weight: 700; font-size: 1.1rem;
  text-transform: uppercase; line-height: 1;
}
.block-duration { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
.block-tag {
  font-family: var(--mono); font-size: 0.62rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 3px 7px; border-radius: 2px;
  background: var(--surface-2); color: var(--muted);
  border: 1px solid var(--border);
}

.mode-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-weight: 800;
  font-size: 0.68rem; letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 4px 8px; border-radius: 2px;
  border: 1px solid currentColor;
  margin-bottom: 6px;
}
.mode-badge .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; display: inline-block;
}
.mode-badge.preview-badge { color: var(--rest); }
.mode-badge.live-badge { color: var(--alert); }
.mode-badge.live-badge .dot { animation: livePulse 1.4s ease-in-out infinite; }
@keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* HIT preview blocks */
.preview-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: 4px;
  padding: 12px 14px;
  margin-bottom: 12px;
}
.preview-block.flow { border-left-color: var(--rest); }
.preview-block.emom { border-left-color: var(--work); }
.preview-block.tabata { border-left-color: var(--alert); }
.preview-block.breath { border-left-color: #c084fc; }
.preview-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.preview-num { font-family: var(--mono); font-size: 0.75rem; color: var(--dim); font-weight: 700; }
.preview-name { font-family: var(--display); font-weight: 800; font-size: 1.1rem; text-transform: uppercase; flex: 1; line-height: 1; }
.preview-meta { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); margin-bottom: 8px; letter-spacing: 0.03em; }
.preview-sub { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
.preview-ex { list-style: none; padding: 0; margin: 0; }
.preview-ex li { padding: 6px 0; }
.preview-ex .ex-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.preview-ex .ex-name { font-weight: 600; font-size: 0.92rem; flex: 1; }
.preview-ex .ex-tgt { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
.preview-ex .ex-minute { font-family: var(--mono); font-size: 0.7rem; color: var(--dim); letter-spacing: 0.05em; text-transform: uppercase; }

/* HIT running screen */
.run-header {
  display: flex; justify-content: space-between; align-items: center;
  padding-bottom: 10px; border-bottom: 1px solid var(--border);
}
.run-crumb { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
.run-crumb .sep { color: var(--dim); margin: 0 6px; }
.block-banner {
  font-family: var(--display); font-weight: 900;
  font-size: 2rem; text-transform: uppercase; line-height: 1;
  margin-top: 14px;
}
.block-banner.work { color: var(--work); }
.block-banner.rest { color: var(--rest); }
.block-banner.alert { color: var(--alert); }
.block-banner.prep { color: var(--rest); }
.block-banner.breath { color: #c084fc; }

.timer-shell { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 0; position: relative; }
.timer-ring {
  position: relative;
  width: min(300px, 75vw);
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
}
.timer-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-ring .track { fill: none; stroke: var(--border); stroke-width: 4; }
.timer-ring .progress { fill: none; stroke: var(--work); stroke-width: 4; stroke-linecap: round; transition: stroke 0.3s ease; }
.timer-ring.rest .progress { stroke: var(--rest); }
.timer-ring.prep .progress { stroke: var(--rest); }
.timer-ring.alert .progress { stroke: var(--alert); animation: ringPulse 0.8s ease-in-out infinite; }
.timer-ring.breath .progress { stroke: #c084fc; }
@keyframes ringPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.timer-num {
  font-family: var(--mono); font-weight: 800;
  font-size: clamp(3.6rem, 16vw, 5.8rem);
  letter-spacing: -0.04em; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.timer-shell.alert .timer-num { color: var(--alert); }
.round-label {
  font-family: var(--mono); font-weight: 700;
  font-size: 0.8rem; letter-spacing: 0.18em;
  color: var(--muted); text-transform: uppercase;
  margin-top: 14px;
}

.exercise-block { text-align: center; padding: 0 6px; }
.exercise-name {
  font-family: var(--display); font-weight: 800;
  font-size: clamp(1.4rem, 5.5vw, 2rem);
  text-transform: uppercase; line-height: 1;
}
.exercise-target { font-size: 0.95rem; color: var(--muted); margin-top: 6px; }
.exercise-next { font-family: var(--mono); font-size: 0.72rem; color: var(--dim); margin-top: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
.exercise-next span { color: var(--muted); }

.ex-list { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 340px; margin: 0 auto; }
.ex-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
}
.ex-item .nm { font-weight: 700; font-size: 0.9rem; }
.ex-item .tg { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
.ex-item.active { border-color: var(--work); background: var(--work-soft); padding-left: 10px; }
.ex-item.active .nm { color: var(--work); }
.ex-item.active .nm::before { content: '▸ '; color: var(--work); font-weight: 800; }

.breath-orb {
  width: 160px; height: 160px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(192,132,252,0.4), rgba(192,132,252,0.05));
  border: 1px solid #c084fc;
  margin: 16px auto;
  transition: transform 4s ease-in-out;
}
.breath-orb.inhale { transform: scale(1.25); transition-duration: 4s; }
.breath-orb.hold   { transform: scale(1.25); transition-duration: 0s; }
.breath-orb.exhale { transform: scale(0.85); transition-duration: 6s; }
.breath-phase { font-family: var(--display); font-weight: 800; font-size: 1.4rem; text-transform: uppercase; color: #c084fc; text-align: center; }

.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.controls .btn { font-size: 0.85rem; min-height: 46px; padding: 10px; }
.controls .full { grid-column: 1 / -1; }
.paused-banner {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--display); font-weight: 900;
  font-size: 2.4rem; text-transform: uppercase;
  color: var(--alert); letter-spacing: 0.04em;
  pointer-events: none;
}

/* Drawer (HIT adjust modal) */
.drawer-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 50;
  opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
}
.drawer-bg.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: var(--surface);
  border-top: 1px solid var(--border-bright);
  border-radius: 12px 12px 0 0;
  z-index: 51;
  transform: translateY(100%);
  transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  max-height: 85vh; overflow-y: auto;
  padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
}
.drawer.open { transform: translateY(0); }
.drawer-handle { width: 40px; height: 4px; background: var(--border-bright); border-radius: 2px; margin: 0 auto 12px; }
.drawer-title { font-family: var(--display); font-weight: 800; font-size: 1.4rem; text-transform: uppercase; margin-bottom: 4px; }
.drawer-sub { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--dim); margin-bottom: 16px; }
.drawer-section { padding: 12px 0; border-top: 1px dashed var(--border); }
.drawer-section:first-of-type { border-top: none; padding-top: 0; }
.drawer-section h3 { font-family: var(--display); font-weight: 700; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; color: var(--muted); }
.swap-input {
  width: 100%; background: var(--surface-2);
  border: 1px solid var(--border-bright); color: var(--text);
  padding: 10px; border-radius: 4px;
  font-family: var(--body); font-size: 0.9rem;
  margin-bottom: 6px;
}
.toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
.toggle {
  width: 44px; height: 26px; border-radius: 13px;
  background: var(--border-bright); position: relative;
  cursor: pointer; transition: background 0.2s ease;
  border: none; padding: 0;
}
.toggle.on { background: var(--work); }
.toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--text); transition: transform 0.2s ease;
}
.toggle.on::after { transform: translateX(18px); background: #1a1408; }

/* ===== Interval Timer styles ===== */
.field {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 10px;
}
.field label {
  font-size: 0.74rem; color: var(--muted);
  letter-spacing: 0.06em; text-transform: uppercase;
  display: block; margin-bottom: 10px; font-weight: 600;
}
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button {
  width: 44px; height: 44px;
  border: 1px solid var(--border-bright);
  background: var(--surface-2); color: var(--text);
  border-radius: 6px; font-size: 1.3rem; font-weight: 600;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.stepper button:active { background: var(--border-bright); }
.stepper .value-wrap { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 6px; }
.stepper .value { font-family: var(--mono); font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.stepper .unit { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.summary-line { text-align: center; font-family: var(--mono); font-size: 0.85rem; color: var(--muted); padding: 14px 0; }
.summary-line .rounds { color: var(--work); font-weight: 700; }
.footnote { margin-top: 14px; font-family: var(--mono); font-size: 0.68rem; color: var(--dim); text-align: center; letter-spacing: 0.04em; line-height: 1.6; }

.simple-run { flex: 1; display: flex; flex-direction: column; text-align: center; }
.simple-phase { font-size: 0.92rem; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; font-family: var(--mono); margin-top: 4px; }
.simple-phase.work { color: var(--work); }
.simple-phase.rest { color: var(--rest); }
.simple-phase.alert { color: var(--alert); }
.simple-timer {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-weight: 800;
  font-size: clamp(4.5rem, 22vw, 7.5rem);
  font-variant-numeric: tabular-nums; letter-spacing: -0.04em; line-height: 1;
}
.simple-timer.alert { color: var(--alert); animation: simplePulse 0.6s ease-in-out infinite; }
@keyframes simplePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
.round-info { font-family: var(--mono); font-size: 0.82rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
.bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 18px; }
.bar-fill { height: 100%; background: var(--work); width: 0%; transition: width 0.2s linear, background 0.15s ease; }
.bar-fill.rest { background: var(--rest); }
.bar-fill.alert { background: var(--alert); }
.paused-tag { display: block; font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.2em; color: var(--alert); margin-top: 12px; text-align: center; font-weight: 700; }

/* Done view (shared) */
.done {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; gap: 6px;
}
.done .check { font-size: 2.2rem; color: var(--rest); font-weight: 700; letter-spacing: 0.04em; margin-bottom: 4px; }
.done h2 { font-family: var(--display); font-weight: 900; font-size: 1.8rem; text-transform: uppercase; margin-bottom: 4px; }
.done .stats { font-family: var(--mono); color: var(--muted); margin-bottom: 24px; font-size: 0.88rem; letter-spacing: 0.04em; }
.done .btn { max-width: 280px; }

/* ===== Builder styles ===== */
.builder-empty {
  text-align: center; padding: 32px 16px;
  background: var(--surface); border: 1px dashed var(--border); border-radius: 8px;
  color: var(--muted); font-size: 0.9rem;
}
.routine-list { display: flex; flex-direction: column; gap: 10px; }
.routine-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}
.routine-card .rname {
  font-family: var(--display); font-weight: 800;
  font-size: 1.2rem; text-transform: uppercase; line-height: 1;
}
.routine-card .rmeta {
  font-family: var(--mono); font-size: 0.72rem;
  color: var(--muted); margin-top: 6px;
}
.routine-card .ractions {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
  margin-top: 12px;
}
.routine-card .ractions .btn { min-height: 38px; font-size: 0.78rem; padding: 8px; }

.field-input {
  width: 100%; background: var(--surface-2);
  border: 1px solid var(--border-bright); color: var(--text);
  padding: 11px; border-radius: 6px;
  font-family: var(--body); font-size: 0.95rem;
  font-weight: 500;
}
.field-input:focus { border-color: var(--work); outline: none; }
.field-label {
  font-family: var(--mono); font-size: 0.7rem;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
  display: block; margin-bottom: 6px;

  display: flex; flex-direction: column; gap: 2px;
  flex-shrink: 0;
}
.exercise-row .ex-handle button {
  width: 26px; height: 22px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 3px; cursor: pointer;
  font-size: 0.7rem;
  display: flex; align-items: center; justify-content: center;
  padding: 0;

.exercise-row .ex-handle button:active { background: var(--border-bright); }

.exercise-row .ex-body {
  flex: 1; min-width: 0;
  cursor: pointer;
}
.exercise-row .ex-title {
  font-weight: 700; font-size: 0.95rem;
  line-height: 1.2;
  word-break: break-word;
}
.exercise-row .ex-spec {
  font-family: var(--mono); font-size: 0.75rem;
  color: var(--muted); margin-top: 4px;
}
.exercise-row .ex-del {
  width: 32px; height: 32px;
  background: transparent; border: 1px solid var(--border);
  color: var(--alert); border-radius: 4px; cursor: pointer;
  flex-shrink: 0; font-size: 0.9rem;
}
.exercise-row .ex-del:active { background: var(--alert-soft); }

/* Exercise picker modal */
.picker-modal {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 60;
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.picker-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.picker-header .ph-title {
  font-family: var(--display); font-weight: 800;
  font-size: 1.2rem; text-transform: uppercase;
  flex: 1; line-height: 1;
}
.picker-header .ph-close {
  background: none; border: none;
  color: var(--muted); font-size: 1.4rem;
  cursor: pointer; padding: 6px;
}
.picker-search {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.picker-search input {
  width: 100%; background: var(--surface-2);
  border: 1px solid var(--border-bright); color: var(--text);
  padding: 10px 12px; border-radius: 6px;
  font-family: var(--body); font-size: 0.95rem;
}
.picker-chips {
  display: flex; gap: 6px;
  padding: 10px 16px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  -webkit-overflow-scrolling: touch;
}
.picker-chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  background: var(--surface-2);
  border: 1px solid var(--border-bright);
  color: var(--muted);
  padding: 6px 12px; border-radius: 999px;

  letter-spacing: 0.05em;
  cursor: pointer;
  text-transform: uppercase;
}
.chip.active { background: var(--work); color: #1a1408; border-color: var(--work); }
.picker-list {
  flex: 1; overflow-y: auto;
  padding: 6px 16px 16px;
  -webkit-overflow-scrolling: touch;
}
.picker-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.picker-item:active { background: var(--surface); }
.picker-item .pi-name { font-weight: 600; font-size: 0.92rem; flex: 1; padding-right: 8px; }
.picker-item .pi-eq { font-family: var(--mono); font-size: 0.7rem; color: var(--dim); letter-spacing: 0.05em; }
.picker-custom {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  margin-bottom: 8px;
  display: flex; gap: 8px;
}
.picker-custom input { flex: 1; background: var(--surface-2); border: 1px solid var(--border-bright); color: var(--text); padding: 8px 10px; border-radius: 4px; font-size: 0.9rem; }
.picker-custom button { background: var(--work); color: #1a1408; border: none; border-radius: 4px; padding: 0 14px; font-weight: 700; cursor: pointer; }

/* Exercise edit dialog */
.edit-dialog-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 70;
  opacity: 0; pointer-events: none;
  transition: opacity 0.18s ease;
}
.edit-dialog-bg.open { opacity: 1; pointer-events: auto; }
.edit-dialog {
  position: fixed; left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(0.96);
  width: calc(100% - 32px); max-width: 420px;
  max-height: 86vh; overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--border-bright);
  border-radius: 10px;
  padding: 18px;
  z-index: 71;
  opacity: 0; pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.edit-dialog.open {
  opacity: 1; pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}
.edit-dialog h3 { font-family: var(--display); font-weight: 800; font-size: 1.2rem; text-transform: uppercase; margin-bottom: 12px; }
.edit-dialog .field-input, .edit-dialog .stepper { margin-bottom: 10px; }
.edit-dialog textarea {
  width: 100%; background: var(--surface-2);

  resize: vertical; min-height: 60px;

.edit-dialog .ed-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }

/* Builder launch */
.bl-exercise-name {
  font-family: var(--display); font-weight: 900;
  font-size: clamp(1.8rem, 7vw, 2.4rem);

}
.bl-set-info {

.bl-target {

}
.bl-target .v { font-weight: 800; color: var(--work); font-size: 1.4rem; }
.bl-notes {
  text-align: center; margin-top: 12px;

.bl-up-next {

.bl-up-next span { color: var(--muted); }
.bl-rest-display {
  font-family: var(--mono); font-weight: 800;

.bl-rest-display.alert { color: var(--alert); animation: simplePulse 0.6s ease-in-out infinite; }

.toast {
  position: fixed; top: 16px; left: 50%;
  transform: translateX(-50%) translateY(-120%);

  border: 1px solid var(--border-bright);
  border-left: 3px solid var(--work);
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 0.85rem;
  z-index: 80;
  transition: transform 0.25s ease;
  max-width: 90%;
}
.toast.show { transform: translateX(-50%) translateY(0); }

<script>
'use strict';

/* ====================================================
   SHARED UTILITIES
   ==================================================== */
function fmt(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function fmtMin(sec) { return Math.round(sec / 60) + ' min'; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* ---------- Audio ---------- */
const audio = {
  ctx: null,
  init() { if (this.ctx) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { this.ctx = null; } },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  beep(freq, dur=0.12, vol=0.35, type='sine') {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
      osc.type = type; osc.frequency.value = freq;
      g.gain.value = 0;
      g.gain.linearRampToValueAtTime(vol, this.ctx.currentTime + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
      osc.connect(g).connect(this.ctx.destination);
      osc.start(); osc.stop(this.ctx.currentTime + dur + 0.02);
    } catch(e) {}
  },
  countdownBeep() { this.beep(880, 0.09, 0.4); },
  workBeep()      { this.beep(1320, 0.22, 0.45, 'square'); },
  restBeep()      { this.beep(523, 0.18, 0.3); },
  doubleBeep()    { this.beep(880, 0.08); setTimeout(()=>this.beep(1320, 0.12), 110); },
  doneBeep() {
    this.beep(523, 0.15);
    setTimeout(()=>this.beep(659, 0.15), 160);
    setTimeout(()=>this.beep(880, 0.35), 320);
  }
};

let voiceOn = true, beepOn = true;
function speak(text) {
  if (!voiceOn) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05; u.volume = 0.92;
    window.speechSynthesis.speak(u);
  } catch(e) {}
}
function stopSpeaking() { try { window.speechSynthesis.cancel(); } catch(e) {} }

/* ---------- Wake Lock ---------- */
let wakeLock = null;
async function requestWakeLock() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
}
async function releaseWakeLock() {
  if (wakeLock) { try { await wakeLock.release(); } catch(e) {} wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && globalRunning()) requestWakeLock();
});

function globalRunning() {
  return (state.view === 'hit' && hit.isRunning) ||
         (state.view === 'timer' && timer.isRunning) ||
         (state.view === 'builder' && builder.isRunning);
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg, color='work') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderLeftColor = color === 'alert' ? 'var(--alert)' : color === 'rest' ? 'var(--rest)' : 'var(--work)';
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

   ==================================================== */
const STORAGE_KEY = 'hit_routines_v1';
function loadRoutines() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return [];
    return parsed;
  } catch(e) { return []; }
}
function saveRoutines() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(builder.routines)); }
  catch(e) { toast('Save failed: storage error', 'alert'); }
}

/* ====================================================
   MAIN TIMING LOOP
   ==================================================== */
let rafId = null, lastFrame = 0;
function startLoop() { if (rafId) return; lastFrame = performance.now(); rafId = requestAnimationFrame(tick); }
function stopLoop() { if (rafId) cancelAnimationFrame(rafId); rafId = null; }

function tick(now) {
  const dt = Math.min(0.5, (now - lastFrame) / 1000);
  lastFrame = now;
  if (state.view === 'hit' && hit.isRunning && !hit.isPaused) hitAdvance(dt);
  if (state.view === 'timer' && timer.isRunning && !timer.isPaused) timerAdvance(dt);
  if (state.view === 'builder' && builder.isRunning && !builder.isPaused) builderAdvance(dt);
  if (state.view === 'hit' && hit.view === 'running') hitUpdateRunning();
  else if (state.view === 'timer' && timer.view === 'running') timerUpdateRunning();
  else if (state.view === 'builder' && builder.view === 'running') builderUpdateRunning();
  rafId = requestAnimationFrame(tick);
}

  else if (state.view === 'hit') renderHIT();

}
function goHome() {

  hit.isRunning = false; timer.isRunning = false; builder.isRunning = false;

  render();
}

function blockKindLabel(k) { return {continuous:'Flow', emom:'EMOM', tabata:'40:20', breathing:'Breath'}[k] || k; }
function blockMetaText(b) {
  if (b.kind === 'emom') return `${b.rounds} rounds · ${b.roundDuration}s each`;
  if (b.kind === 'tabata') return `${b.rounds} × ${b.work}s / ${b.rest}s`;
  if (b.kind === 'continuous') return fmtMin(b.duration) + ' continuous';
  if (b.kind === 'breathing') return fmtMin(b.duration) + ' · 4·4·6';
  return '';
}
function blockDurationSeconds(b) {
  switch(b.kind) {
    case 'continuous': return (b.prep||0) + b.duration;
    case 'emom': return (b.prep||0) + b.roundDuration * b.rounds;
    case 'tabata': return (b.prep||0) + (b.work + b.rest) * b.rounds - b.rest;
    case 'breathing': return b.duration;
  }
}
function applySwap(name) { return hit.swaps[name] || name; }

function buildSegments(block) {
  const segs = [];
  switch(block.kind) {
    case 'continuous': {
      if (block.prep) segs.push({ type:'prep', duration:block.prep, label:'Get ready' });
      segs.push({ type:'work', duration:block.duration, label:block.name, blockKind:'continuous', exercises:block.exercises });
      break;
    }
    case 'emom': {
      if (block.prep) segs.push({ type:'prep', duration:block.prep, label:'EMOM starting' });
      for (let i=1; i<=block.rounds; i++) {
        const ex = (i%2===1) ? block.exA : block.exB;
        const nextEx = (i+1<=block.rounds) ? ((i+1)%2===1 ? block.exA : block.exB) : null;
        segs.push({ type:'work', duration:block.roundDuration, label:ex.name, sublabel:ex.target, round:i, totalRounds:block.rounds, next:nextEx?nextEx.name:null, blockKind:'emom' });
      }
      break;
    }
    case 'tabata': {
      if (block.prep) segs.push({ type:'prep', duration:block.prep, label:'Finisher starting' });
      for (let i=1; i<=block.rounds; i++) {
        const ex = (i%2===1) ? block.exA : block.exB;
        const nextEx = (i+1<=block.rounds) ? ((i+1)%2===1 ? block.exA : block.exB) : null;
        segs.push({ type:'work', duration:block.work, label:ex.name, sublabel:ex.target, round:i, totalRounds:block.rounds, next:nextEx?nextEx.name:null, blockKind:'tabata' });
        if (i < block.rounds) segs.push({ type:'rest', duration:block.rest, label:'Rest', sublabel:nextEx?'Next: '+nextEx.name:'' , blockKind:'tabata' });
      }
      break;
    }
    case 'breathing': segs.push({ type:'breathing', duration:block.duration, label:'Box Breathing', pattern:block.pattern }); break;
  }
  return segs;
}

function hitAdvance(dt) {
  const seg = hit.segments[hit.segIndex];
  if (!seg) return;
  const prev = hit.segElapsed;
  hit.segElapsed += dt;
  hit.totalElapsed += dt;
  const remaining = seg.duration - hit.segElapsed;

  if (seg.type !== 'breathing') {
    for (const s of [3,2,1]) {
      if (prev < seg.duration - s && hit.segElapsed >= seg.duration - s) audio.countdownBeep();
    }
  }
  if (seg.type === 'breathing') {
    const p = seg.pattern, total = p.inhale + p.hold + p.exhale;
    const pos = hit.segElapsed % total;
    const phase = pos < p.inhale ? 'inhale' : pos < p.inhale + p.hold ? 'hold' : 'exhale';
    if (phase !== hit.lastBreathPhase) {
      hit.lastBreathPhase = phase;
      speak(phase === 'inhale' ? 'Inhale' : phase === 'hold' ? 'Hold' : 'Exhale');
    }
  }
  if (seg.type === 'work' && seg.blockKind === 'continuous' && seg.exercises) {
    if (hit.segElapsed - hit.carouselLastTick >= Math.max(30, seg.duration / seg.exercises.length)) {
      hit.carouselLastTick = hit.segElapsed;
      hit.carouselIndex = (hit.carouselIndex + 1) % seg.exercises.length;
      const ex = seg.exercises[hit.carouselIndex];
      speak(applySwap(ex.name) + ', ' + ex.target);
    }
  }
  if (hit.segElapsed >= seg.duration) hitAdvanceSegment();
}

function hitAdvanceSegment() {
  hit.segIndex++;
  hit.segElapsed = 0;
  hit.carouselIndex = 0;
  hit.carouselLastTick = 0;
  hit.lastBreathPhase = null;
  if (hit.segIndex >= hit.segments.length) {
    audio.doubleBeep();
    speak('Block complete');
    hitAdvanceBlock();
  } else {
    hitOnSegmentEnter(hit.segments[hit.segIndex]);
  }
}

function hitOnSegmentEnter(seg) {
  if (seg.type === 'work') {
    audio.workBeep();
    if (seg.blockKind === 'emom' || seg.blockKind === 'tabata') {
      speak('Round ' + seg.round + '. ' + applySwap(seg.label));
    } else if (seg.blockKind === 'continuous' && seg.exercises) {
      speak(seg.label + ' begins. Start with ' + applySwap(seg.exercises[0].name));
    } else speak(seg.label);
  } else if (seg.type === 'rest') {
    audio.restBeep();
    speak(seg.sublabel ? 'Rest. ' + seg.sublabel : 'Rest');
  } else if (seg.type === 'prep') {
    speak(seg.label);
  } else if (seg.type === 'breathing') {
    speak('Begin box breathing');
    hit.lastBreathPhase = null;
  }
}

function hitAdvanceBlock() {
  hit.blockIndex++;
  if (hit.blockIndex >= HIT_WORKOUTS[hit.day].blocks.length) hitFinish();
  else hitStartBlock();
}

function hitStartBlock() {
  const block = HIT_WORKOUTS[hit.day].blocks[hit.blockIndex];
  hit.segments = buildSegments(block);
  hit.segIndex = 0; hit.segElapsed = 0;
  hit.carouselIndex = 0; hit.carouselLastTick = 0;
  hit.lastBreathPhase = null;
  speak('Starting ' + block.name);
  audio.beep(660, 0.18);
  setTimeout(() => hitOnSegmentEnter(hit.segments[0]), 600);
}

function hitFinish() {
  hit.isRunning = false;
  hit.view = 'done';
  audio.doneBeep();
  speak('Workout complete. Great work.');
  releaseWakeLock();
  render();
}

function hitBeginRun() {
  audio.init(); audio.resume();
  hit.view = 'running';
  hit.blockIndex = 0;
  hit.totalElapsed = 0;
  hit.isRunning = true;
  hit.isPaused = false;
  requestWakeLock();
  hitStartBlock();
}

function hitTogglePause() {
  hit.isPaused = !hit.isPaused;
  if (hit.isPaused) { stopSpeaking(); speak('Paused'); }
  else { audio.resume(); speak('Resuming'); }
}
function hitSkipSegment() { if (hit.isRunning) hit.segElapsed = hit.segments[hit.segIndex].duration; }
function hitSkipBlock() { stopSpeaking(); hitAdvanceBlock(); }
function hitRestartBlock() { hitStartBlock(); }

function renderHITRunning() {
  const block = HIT_WORKOUTS[hit.day].blocks[hit.blockIndex];
  const seg = hit.segments[hit.segIndex];
  if (!seg) return;
  const remaining = Math.max(0, seg.duration - hit.segElapsed);
  const inFinal = seg.type !== 'breathing' && remaining <= 3 && remaining > 0;
  const ringState = inFinal ? 'alert' : seg.type === 'rest' ? 'rest' : seg.type === 'prep' ? 'prep' : seg.type === 'breathing' ? 'breath' : 'work';
  const progress = hit.segElapsed / seg.duration;
  const circ = 2 * Math.PI * 46;
  const dash = circ * (1 - progress);

  let body = '';
  if (seg.type === 'breathing') {
    const p = seg.pattern, total = p.inhale + p.hold + p.exhale;
    const pos = hit.segElapsed % total;
    const phase = pos < p.inhale ? 'inhale' : pos < p.inhale + p.hold ? 'hold' : 'exhale';
    body = `<div class="breath-orb ${phase}"></div><div class="breath-phase">${phase[0].toUpperCase()+phase.slice(1)}</div>`;
  } else if (seg.blockKind === 'continuous' && seg.exercises) {
    body = `<div class="ex-list">${seg.exercises.map((e,i)=>`<div class="ex-item ${i===hit.carouselIndex?'active':''}"><span class="nm">${applySwap(e.name)}</span><span class="tg">${e.target}</span></div>`).join('')}</div>`;
  } else if (seg.type === 'prep') {
    body = `<div class="exercise-block"><div class="exercise-name" style="color:var(--rest)">Get Ready</div><div class="exercise-target">${block.name} starting</div></div>`;
  } else if (seg.type === 'rest') {
    body = `<div class="exercise-block"><div class="exercise-name" style="color:var(--rest)">Rest</div><div class="exercise-target">${seg.sublabel||''}</div></div>`;
  } else {
    body = `<div class="exercise-block"><div class="exercise-name">${applySwap(seg.label)}</div><div class="exercise-target">${seg.sublabel||''}</div>${seg.next?`<div class="exercise-next">Next: <span>${applySwap(seg.next)}</span></div>`:''}</div>`;
  }

  const roundLabel = seg.round ? `Round ${seg.round} / ${seg.totalRounds}` :
    (seg.type === 'breathing' ? 'Recovery' : seg.type === 'prep' ? 'Prep' : seg.type === 'rest' ? 'Recovery' : 'Block in progress');

  app.innerHTML = `
    <div class="screen">
      <div class="run-header">
        <div class="mode-badge live-badge"><span class="dot"></span> Live</div>
        <div class="run-crumb">Day ${hit.day} <span class="sep">·</span> Block ${hit.blockIndex+1}/${HIT_WORKOUTS[hit.day].blocks.length} <span class="sep">·</span> ${seg.type.toUpperCase()}</div>
      </div>
      <div class="block-banner ${ringState}">${block.name}</div>
      <div class="timer-shell ${inFinal?'alert':seg.type==='rest'?'rest':''}">
        <div class="timer-ring ${ringState}" aria-hidden="true">
          <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="46"/><circle class="progress" cx="50" cy="50" r="46" stroke-dasharray="${circ}" stroke-dashoffset="${dash}"/></svg>
          <div class="timer-num">${fmt(remaining)}</div>
        </div>
        <div class="round-label">${roundLabel}</div>
        ${hit.isPaused?'<div class="paused-banner">Paused</div>':''}
      </div>
      <div style="padding: 4px 0;">${body}</div>
      <div class="controls">
        <button class="btn ${hit.isPaused?'primary':''}" id="pauseBtn">${hit.isPaused?'▶ Resume':'⏸ Pause'}</button>
        <button class="btn" id="skipBtn">Skip ⏭</button>
        <button class="btn full ghost" id="adjustBtn">⚙ Adjust / Swap / Modify</button>
      </div>
    </div>
  `;

  document.getElementById('skipBtn').addEventListener('click', () => { hitSkipSegment(); renderHITRunning(); });
  document.getElementById('adjustBtn').addEventListener('click', openHITDrawer);
}

let hitLastRenderTime = 0;
let hitLastRemainingSec = -1;
function hitUpdateRunning() {
  // Throttle: rerender only when displayed second changes, or on phase boundary
  const seg = hit.segments[hit.segIndex];
  if (!seg) return;
  const remaining = Math.max(0, seg.duration - hit.segElapsed);
  const remainingSec = Math.ceil(remaining);
  const now = performance.now();
  if (remainingSec !== hitLastRemainingSec || now - hitLastRenderTime > 500) {
    hitLastRemainingSec = remainingSec;
    hitLastRenderTime = now;
    renderHITRunning();
  }
}

function buildHITDrawer() {
  const block = HIT_WORKOUTS[hit.day].blocks[hit.blockIndex];
  document.getElementById('drawerSub').textContent = block.name + ' · session-only';
  const body = document.getElementById('drawerBody');
  body.innerHTML = '';

  // Flow controls
  const flow = document.createElement('div');
  flow.className = 'drawer-section';
  flow.innerHTML = '<h3>Flow</h3>';
  const grid = document.createElement('div');
  grid.className = 'controls';
  grid.innerHTML = `
    <button class="btn" data-act="skipSeg">Skip Segment ⏭</button>
    <button class="btn" data-act="restartBlock">Restart Block ↺</button>
    <button class="btn ghost" data-act="skipBlock">Skip Block ⏩</button>
    <button class="btn danger" data-act="quit">Quit ✕</button>
  `;
  flow.appendChild(grid);
  body.appendChild(flow);

  // Swaps
  const names = new Set();
  if (block.exercises) block.exercises.forEach(e => names.add(e.name));
  if (block.exA) names.add(block.exA.name);
  if (block.exB) names.add(block.exB.name);
  if (names.size > 0) {
    const sw = document.createElement('div');
    sw.className = 'drawer-section';
    sw.innerHTML = '<h3>Swap Exercises</h3>';
    names.forEach(orig => {
      const wrap = document.createElement('div');
      wrap.style.marginBottom = '8px';
      const lbl = document.createElement('div');
      lbl.style.cssText = 'font-size:0.78rem;color:var(--muted);margin-bottom:3px;';
      lbl.textContent = orig;
      wrap.appendChild(lbl);
      const inp = document.createElement('input');
      inp.className = 'swap-input';
      inp.type = 'text'; inp.placeholder = 'Replace with...';
      inp.value = hit.swaps[orig] || '';
      inp.addEventListener('change', e => {
        const v = e.target.value.trim();
        if (v) hit.swaps[orig] = v; else delete hit.swaps[orig];
      });
      wrap.appendChild(inp);
      sw.appendChild(wrap);
    });
    body.appendChild(sw);
  }

  // Audio
  const a = document.createElement('div');
  a.className = 'drawer-section';
  a.innerHTML = '<h3>Audio</h3>';
  a.appendChild(makeToggleRow('Voice', () => voiceOn, v => { voiceOn = v; if (!v) stopSpeaking(); }));
  a.appendChild(makeToggleRow('Beeps', () => beepOn, v => { beepOn = v; }));
  body.appendChild(a);

  const close = document.createElement('button');
  close.className = 'btn primary'; close.style.marginTop = '12px';
  close.textContent = 'Resume';
  close.dataset.act = 'resume';
  body.appendChild(close);

  body.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', () => {
      const act = el.dataset.act;
      if (act === 'skipSeg') { hitSkipSegment(); closeHITDrawer(); if (hit.isPaused) hitTogglePause(); }
      else if (act === 'restartBlock') { hitRestartBlock(); closeHITDrawer(); if (hit.isPaused) hitTogglePause(); }
      else if (act === 'skipBlock') { hitSkipBlock(); closeHITDrawer(); if (hit.isPaused) hitTogglePause(); }
      else if (act === 'quit') { closeHITDrawer(); goHome(); }
      else if (act === 'resume') { closeHITDrawer(); if (hit.isPaused) hitTogglePause(); }
    });
  });
}

function makeToggleRow(label, getVal, setVal) {
  const row = document.createElement('div');
  row.className = 'toggle-row';
  const lbl = document.createElement('span');
  lbl.textContent = label;
  const tg = document.createElement('button');
  tg.type = 'button';
  tg.className = 'toggle' + (getVal() ? ' on' : '');
  tg.setAttribute('role','switch');
  tg.setAttribute('aria-checked', getVal() ? 'true' : 'false');
  tg.setAttribute('aria-label', label);
  tg.addEventListener('click', () => {
    const v = !getVal(); setVal(v);
    tg.classList.toggle('on');
    tg.setAttribute('aria-checked', v ? 'true':'false');
  });
  row.appendChild(lbl); row.appendChild(tg);
  return row;
}

/* ====================================================
   INTERVAL TIMER MODULE
   ==================================================== */
function computeRounds(work, rest, sessionMin) {
  const target = sessionMin * 60, cycle = work + rest;
  if (cycle === 0) return 1;
  return Math.max(1, Math.round(target / cycle));
}
function actualSeconds(work, rest, rounds) { return rounds * (work + rest); }

function timerAdvance(dt) {
  const prev = timer.remaining;
  timer.remaining -= dt;
  timer.totalElapsed += dt;
  for (let s = 5; s >= 1; s--) {
    if (prev > s && timer.remaining <= s) audio.countdownBeep();
  }
  if (timer.remaining <= 0) timerNextPhase();
}

function timerNextPhase() {
  if (timer.phase === 'rest') {
    timer.phase = 'work';
    timer.remaining = timer.work;
    audio.workBeep();
    speak('Round ' + timer.roundIndex);
  } else {
    if (timer.roundIndex >= timer.rounds) { timerFinish(); return; }
    timer.roundIndex++;
    if (timer.rest > 0) {
      timer.phase = 'rest';
      timer.remaining = timer.rest;
      audio.restBeep();
      speak('Rest');
    } else {
      timer.phase = 'work';
      timer.remaining = timer.work;
      audio.workBeep();
      speak('Round ' + timer.roundIndex);
    }
  }
}

function timerStart() {
  audio.init(); audio.resume();
  timer.rounds = computeRounds(timer.work, timer.rest, timer.sessionMin);
  timer.roundIndex = 1;
  timer.totalElapsed = 0;
  timer.isRunning = true;
  timer.isPaused = false;
  timer.view = 'running';
  requestWakeLock();
  if (timer.rest > 0) {
    timer.phase = 'rest';
    timer.remaining = timer.rest;
    audio.restBeep();
  } else {
    timer.phase = 'work';
    timer.remaining = timer.work;
    audio.workBeep();
    speak('Round 1');
  }
  render();
}
function timerTogglePause() {
  timer.isPaused = !timer.isPaused;
  if (timer.isPaused) { stopSpeaking(); speak('Paused'); }
  else { audio.resume(); speak('Resuming'); }
}
function timerReset() {
  timer.isRunning = false; timer.isPaused = false;
  timer.view = 'setup'; timer.totalElapsed = 0;
  stopSpeaking(); releaseWakeLock();
  render();
}
function timerFinish() {
  timer.isRunning = false;
  timer.view = 'done';
  audio.doneBeep();
  speak('Session complete');
  releaseWakeLock();
  render();
}
function timerAdjust(key, delta) {
  if (key === 'work') timer.work = Math.max(5, Math.min(600, timer.work + delta));
  else if (key === 'rest') timer.rest = Math.max(0, Math.min(300, timer.rest + delta));
  else if (key === 'session') timer.sessionMin = Math.max(1, Math.min(120, timer.sessionMin + delta));
}

function renderTimer() {
  if (timer.view === 'setup') renderTimerSetup();
  else if (timer.view === 'running') renderTimerRunning();
  else if (timer.view === 'done') renderTimerDone();
}

function timerUpdateRunning() {
  if (!timer._refs) return;
  const isFinal = timer.remaining <= 5 && timer.remaining > 0;
  const cls = isFinal ? 'alert' : timer.phase;
  const label = timer.phase === 'work' ? 'Work' : 'Rest';
  if (timer._refs.phase.textContent !== label) timer._refs.phase.textContent = label;
  timer._refs.phase.className = 'simple-phase ' + cls;
  timer._refs.timer.textContent = fmt(timer.remaining);
  timer._refs.timer.className = 'simple-timer' + (isFinal ? ' alert' : '');
  timer._refs.round.textContent = 'Round ' + timer.roundIndex + ' / ' + timer.rounds;
  const total = actualSeconds(timer.work, timer.rest, timer.rounds);
  timer._refs.bar.className = 'bar-fill ' + cls;
  timer._refs.bar.style.width = Math.min(100, (timer.totalElapsed / total) * 100) + '%';
  const pt = timer.isPaused ? '▶ Resume' : '⏸ Pause';
  if (timer._refs.pause.textContent !== pt) timer._refs.pause.textContent = pt;
  timer._refs.paused.hidden = !timer.isPaused;
}

// Track deletion confirmation per-card (use a temporary armed state)
let deleteArmedId = null;
let deleteArmTimer = null;
function confirmAndDelete(id, name) {
  if (deleteArmedId === id) {
    clearTimeout(deleteArmTimer);
    deleteArmedId = null;
    builder.routines = builder.routines.filter(r => r.id !== id);
    saveRoutines();
    toast('Deleted "' + name + '"', 'alert');
    render();
    return;
  }
  deleteArmedId = id;
  const btn = app.querySelector(`button[data-act="del"][data-id="${id}"]`);
  if (btn) {
    btn.textContent = 'Confirm?';
    btn.classList.add('armed');
  }
  deleteArmTimer = setTimeout(() => {
    deleteArmedId = null;
    if (btn) { btn.textContent = 'Delete'; btn.classList.remove('armed'); }
  }, 3000);
}

function routineEstimatedSec(r) {
  return r.exercises.reduce((s, ex) => {
    const setTime = 30; // rough estimate per set work
    return s + ex.sets * setTime + Math.max(0, ex.sets - 1) * (ex.restSec || 60);
  }, 0);
}

      <input id="nameInput" class="field-input" type="text" value="${escapeHtml(r.name)}" placeholder="e.g. Push Day A" style="margin-bottom: 16px;">

      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">
        <span class="field-label" style="margin:0;">Exercises (${r.exercises.length})</span>
      </div>

      <div id="exList" style="flex:1;overflow-y:auto;">
        ${r.exercises.length === 0
          ? `<div class="builder-empty">No exercises yet</div>`
          : r.exercises.map((ex, i) => renderExerciseRow(ex, i)).join('')}
      </div>

      <button class="btn ghost" id="addExBtn" style="margin: 12px 0;">+ Add Exercise</button>

      <div style="display:grid;grid-template-columns:1fr 2fr;gap:8px;">
        <button class="btn ghost" id="cancelBtn2">Cancel</button>
        <button class="btn primary" id="saveBtn">${builder.editingIsNew ? 'Save Routine' : 'Save Changes'}</button>
      </div>
    </div>
  `;
  const cancel = () => { builder.editing = null; builder.view = 'home'; render(); };
  document.getElementById('cancelBtn').addEventListener('click', cancel);
  document.getElementById('cancelBtn2').addEventListener('click', cancel);
  document.getElementById('nameInput').addEventListener('input', e => { r.name = e.target.value; });
  document.getElementById('addExBtn').addEventListener('click', openExercisePicker);
  document.getElementById('saveBtn').addEventListener('click', () => {
    if (!r.name.trim()) { toast('Routine needs a name', 'alert'); return; }
    if (r.exercises.length === 0) { toast('Add at least one exercise', 'alert'); return; }
    r.name = r.name.trim();
    r.updated = Date.now();
    const idx = builder.routines.findIndex(x => x.id === r.id);
    if (idx >= 0) builder.routines[idx] = r; else builder.routines.push(r);
    saveRoutines();
    toast('Saved "' + r.name + '"');
    builder.editing = null;
    builder.view = 'home';
    render();
  });

  // Wire per-exercise actions
  app.querySelectorAll('[data-ex-act]').forEach(b => {
    b.addEventListener('click', () => {
      const idx = +b.dataset.idx;
      const act = b.dataset.exAct;
      if (act === 'up' && idx > 0) {
        [r.exercises[idx-1], r.exercises[idx]] = [r.exercises[idx], r.exercises[idx-1]];
      } else if (act === 'down' && idx < r.exercises.length - 1) {
        [r.exercises[idx+1], r.exercises[idx]] = [r.exercises[idx], r.exercises[idx+1]];
      } else if (act === 'del') {
        r.exercises.splice(idx, 1);
      } else if (act === 'edit') {
        openExerciseEditDialog(idx);
        return;
      }
      render();
    });
  });
  app.querySelectorAll('[data-ex-body]').forEach(el => {
    el.addEventListener('click', () => {
      openExerciseEditDialog(+el.dataset.idx);
    });
  });
}

function renderExerciseRow(ex, i) {
  const total = builder.editing.exercises.length;
  return `
    <div class="exercise-row">
      <div class="ex-handle">
        <button data-ex-act="up" data-idx="${i}" ${i===0?'disabled':''} aria-label="Move up">▲</button>
        <button data-ex-act="down" data-idx="${i}" ${i===total-1?'disabled':''} aria-label="Move down">▼</button>
      </div>
      <div class="ex-body" data-ex-body data-idx="${i}">
        <div class="ex-title">${escapeHtml(ex.name)}</div>
        <div class="ex-spec">${ex.sets} × ${escapeHtml(String(ex.reps))}${ex.weight ? ' @ ' + escapeHtml(ex.weight) : ''} · ${ex.restSec}s rest${ex.notes ? ' · note' : ''}</div>
      </div>
      <button class="ex-del" data-ex-act="del" data-idx="${i}" aria-label="Delete exercise">✕</button>

}

/* Export / Import */
function exportRoutines() {
  if (builder.routines.length === 0) { toast('No routines to export', 'alert'); return; }
  const json = JSON.stringify({ version: 1, exported: new Date().toISOString(), routines: builder.routines }, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `hit_routines_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Exported ' + builder.routines.length + ' routine(s)');
}

function importRoutines(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const parsed = JSON.parse(ev.target.result);
      let imported = [];
      if (Array.isArray(parsed)) imported = parsed;
      else if (parsed && Array.isArray(parsed.routines)) imported = parsed.routines;
      else throw new Error('bad format');

      // Validate and de-dup
      const valid = imported.filter(r => r && typeof r.name === 'string' && Array.isArray(r.exercises));
      if (valid.length === 0) throw new Error('no valid routines');

      // Assign new IDs to avoid collision
      valid.forEach(r => { r.id = uid(); r.updated = Date.now(); });
      builder.routines = builder.routines.concat(valid);
      saveRoutines();
      toast('Imported ' + valid.length + ' routine(s)');
      render();
    } catch (err) {
      toast('Import failed: bad file format', 'alert');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}

/* ---------- Builder Launch (runtime) ---------- */
function builderStartLaunch(r) {
  audio.init(); audio.resume();
  builder.runRoutine = JSON.parse(JSON.stringify(r));
  builder.exerciseIndex = 0;
  builder.setIndex = 0;
  builder.inPrep = true;
  builder.prepRemaining = 10;
  builder.inRest = false;
  builder.restRemaining = 0;
  builder.totalElapsed = 0;
  builder.isRunning = true;
  builder.isPaused = false;
  builder.view = 'running';
  requestWakeLock();
  speak('Get ready');
  render();
}

function builderAdvance(dt) {
  if (builder.inPrep) {
    const prev = builder.prepRemaining;
    builder.prepRemaining -= dt;
    builder.totalElapsed += dt;
    for (let s = 3; s >= 1; s--) {
      if (prev > s && builder.prepRemaining <= s) audio.countdownBeep();
    }
    if (builder.prepRemaining <= 0) {
      builder.inPrep = false;
      const firstEx = builder.runRoutine.exercises[0];
      audio.workBeep();
      speak(firstEx.name + '. Set 1.');
    }
    return;
  }
  if (!builder.inRest) {
    // Working: track total elapsed only; user taps "Done set" to advance
    builder.totalElapsed += dt;
    return;
  }
  // In rest: count down
  const prev = builder.restRemaining;
  builder.restRemaining -= dt;
  builder.totalElapsed += dt;
  for (let s = 5; s >= 1; s--) {
    if (prev > s && builder.restRemaining <= s) audio.countdownBeep();
  }
  if (builder.restRemaining <= 0) {
    // Rest done — advance to next set or next exercise
    builder.inRest = false;
    builderAdvanceSet();
  }
}

function builderDoneSet() {
  const r = builder.runRoutine;
  const ex = r.exercises[builder.exerciseIndex];
  const isLastSetOfExercise = builder.setIndex >= ex.sets - 1;
  const isLastExercise = builder.exerciseIndex >= r.exercises.length - 1;

  if (isLastSetOfExercise && isLastExercise) {
    builderFinish();
    return;
  }

  // Enter rest phase
  // If last set of this exercise: rest into next exercise's set 1
  // Otherwise: rest before next set of same exercise
  const restSec = ex.restSec || 0;
  if (restSec <= 0) {
    // No rest — just advance immediately
    builderAdvanceSet();
    return;
  }
  builder.inRest = true;
  builder.restRemaining = restSec;
  audio.restBeep();
  speak('Rest');
}

function builderAdvanceSet() {
  const r = builder.runRoutine;
  const ex = r.exercises[builder.exerciseIndex];
  if (builder.setIndex < ex.sets - 1) {
    // Next set of same exercise
    builder.setIndex++;
    audio.workBeep();
    speak('Set ' + (builder.setIndex + 1));
  } else {
    // Next exercise
    builder.exerciseIndex++;
    builder.setIndex = 0;
    const nextEx = r.exercises[builder.exerciseIndex];
    audio.workBeep();
    speak(nextEx.name + '. Set 1.');
  }
}

function builderTogglePause() {
  builder.isPaused = !builder.isPaused;
  if (builder.isPaused) { stopSpeaking(); speak('Paused'); }
  else { audio.resume(); speak('Resuming'); }
}

function builderFinish() {
  builder.isRunning = false;
  builder.view = 'done';
  audio.doneBeep();
  speak('Workout complete');
  releaseWakeLock();
  render();
}

function builderQuit() {
  builder.isRunning = false;
  builder.isPaused = false;
  stopSpeaking();
  releaseWakeLock();
  builder.view = 'home';
  render();
}

function builderSkipRest() {
  if (builder.inRest) {
    builder.restRemaining = 0.01;
  }
}

function renderBuilderRunning() {
  app.innerHTML = `
    <div class="screen">
      <div class="app-header">
        <div class="mode-badge live-badge"><span class="dot"></span> Live</div>
        <div class="run-crumb" style="text-align:right;">${escapeHtml(builder.runRoutine.name)}</div>
      </div>
      <div id="blRunBody" style="flex:1;display:flex;flex-direction:column;"></div>
      <div class="controls" id="blControls"></div>
      ${builder.isPaused ? '<div class="paused-tag">PAUSED</div>' : ''}
    </div>
  `;
  builderLastDisplaySec = -1; // reset throttle state
  builderUpdateRunningDOM();
}

let builderLastRenderTime = 0;
let builderLastDisplaySec = -1;
function builderUpdateRunning() {
  // Throttle: rerender only when displayed second changes (during rest) or on phase change
  const r = builder.runRoutine;
  if (!r) return;
  const ex = r.exercises[builder.exerciseIndex];
  if (!ex) return;
  const currentSec = builder.inPrep ? Math.ceil(builder.prepRemaining)
                   : builder.inRest ? Math.ceil(builder.restRemaining)
                   : -2;
  const now = performance.now();
  if (currentSec === builderLastDisplaySec && now - builderLastRenderTime < 500) return;
  builderLastDisplaySec = currentSec;
  builderLastRenderTime = now;
  builderUpdateRunningDOM();
}

function builderUpdateRunningDOM() {
  const r = builder.runRoutine;
  if (!r) return;
  const ex = r.exercises[builder.exerciseIndex];
  if (!ex) return;
  const body = document.getElementById('blRunBody');
  const controls = document.getElementById('blControls');
  if (!body || !controls) return;

  if (builder.inPrep) {
    const isFinal = builder.prepRemaining <= 3 && builder.prepRemaining > 0;
    const firstEx = r.exercises[0];
    body.innerHTML = `
      <div style="text-align:center;font-family:var(--mono);font-size:0.85rem;letter-spacing:0.3em;color:var(--rest);text-transform:uppercase;margin-top:8px;">Get Ready</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;">
        <div class="bl-rest-display ${isFinal?'alert':''}">${Math.ceil(builder.prepRemaining)}</div>
        <div style="margin-top:24px;font-family:var(--mono);font-size:0.78rem;letter-spacing:0.12em;color:var(--dim);text-transform:uppercase;">Starting With</div>
        <div style="font-family:var(--display);font-weight:800;font-size:1.4rem;text-transform:uppercase;margin-top:6px;text-align:center;padding:0 8px;">${escapeHtml(firstEx.name)}</div>
        <div style="font-family:var(--mono);color:var(--muted);margin-top:6px;font-size:0.85rem;">Set 1 · ${escapeHtml(String(firstEx.reps))} reps${firstEx.weight ? ' @ ' + escapeHtml(firstEx.weight) : ''}</div>
      </div>
    `;
    controls.innerHTML = `
      <button class="btn ${builder.isPaused?'primary':''}" id="pauseBtn">${builder.isPaused?'▶ Resume':'⏸ Pause'}</button>
      <button class="btn" id="skipPrepBtn">Skip ⏭</button>
      <button class="btn full ghost" id="quitBtn">Quit Workout</button>
    `;
  } else if (builder.inRest) {
    const isFinal = builder.restRemaining <= 5 && builder.restRemaining > 0;
    const nextSetNum = builder.setIndex < ex.sets - 1 ? builder.setIndex + 2 : 1;
    const nextEx = builder.setIndex < ex.sets - 1 ? ex : r.exercises[builder.exerciseIndex + 1];
    const target = nextEx || ex;
    body.innerHTML = `
      <div style="text-align:center;font-family:var(--mono);font-size:0.85rem;letter-spacing:0.3em;color:var(--rest);text-transform:uppercase;margin-top:8px;">Rest</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;">
        <div class="bl-rest-display ${isFinal?'alert':''}">${fmt(builder.restRemaining)}</div>
        <div style="margin-top:18px;font-family:var(--mono);font-size:0.78rem;letter-spacing:0.12em;color:var(--dim);text-transform:uppercase;">Up Next</div>
        <div style="font-family:var(--display);font-weight:800;font-size:1.4rem;text-transform:uppercase;margin-top:6px;text-align:center;padding:0 8px;">${escapeHtml(nextEx ? nextEx.name : '')}</div>
        <div style="font-family:var(--mono);color:var(--muted);margin-top:6px;font-size:0.85rem;">Set ${nextSetNum} · ${escapeHtml(String(target.reps))} reps${target.weight ? ' @ ' + escapeHtml(target.weight) : ''}</div>
      </div>
    `;
    controls.innerHTML = `
      <button class="btn ${builder.isPaused?'primary':''}" id="pauseBtn">${builder.isPaused?'▶ Resume':'⏸ Pause'}</button>
      <button class="btn rest" id="skipRestBtn">Skip Rest ⏭</button>
      <button class="btn full ghost" id="quitBtn">Quit Workout</button>
    `;
  } else {
    // Working phase — no countdown timer; user taps Done Set
    const isLastSet = builder.setIndex >= ex.sets - 1;
    const isLastEx = builder.exerciseIndex >= r.exercises.length - 1;
    const nextLine = isLastSet && isLastEx ? 'Final set' :
      isLastSet ? 'Next: ' + escapeHtml(r.exercises[builder.exerciseIndex + 1].name) :
      'Then: Set ' + (builder.setIndex + 2);

    body.innerHTML = `
      <div style="text-align:center;font-family:var(--mono);font-size:0.85rem;letter-spacing:0.3em;color:var(--work);text-transform:uppercase;margin-top:8px;">Work</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;">
        <div class="bl-exercise-name">${escapeHtml(ex.name)}</div>
        <div class="bl-set-info">Set ${builder.setIndex + 1} of ${ex.sets}</div>
        <div class="bl-target">Target: <span class="v">${escapeHtml(String(ex.reps))}</span> reps${ex.weight ? ' · <span class="v">' + escapeHtml(ex.weight) + '</span>' : ''}</div>
        ${ex.notes ? `<div class="bl-notes">${escapeHtml(ex.notes)}</div>` : ''}
        <div class="bl-up-next">${nextLine}</div>
        <div style="margin-top:14px;font-family:var(--mono);font-size:0.7rem;color:var(--dim);letter-spacing:0.1em;text-transform:uppercase;">Exercise ${builder.exerciseIndex + 1} / ${r.exercises.length}</div>
      </div>
    `;
    controls.innerHTML = `
      <button class="btn ${builder.isPaused?'primary':''}" id="pauseBtn">${builder.isPaused?'▶ Resume':'⏸ Pause'}</button>
      <button class="btn primary" id="doneSetBtn">✓ Done Set</button>
      <button class="btn full ghost" id="quitBtn">Quit Workout</button>
    `;
  }

  const pauseBtn = document.getElementById('pauseBtn');
  if (pauseBtn) pauseBtn.addEventListener('click', () => { builderTogglePause(); builderUpdateRunningDOM(); });
  const doneBtn = document.getElementById('doneSetBtn');
  if (doneBtn) doneBtn.addEventListener('click', () => { builderDoneSet(); builderUpdateRunningDOM(); });
  const skipBtn = document.getElementById('skipRestBtn');
  if (skipBtn) skipBtn.addEventListener('click', () => { builderSkipRest(); });
  const skipPrepBtn = document.getElementById('skipPrepBtn');
  if (skipPrepBtn) skipPrepBtn.addEventListener('click', () => { builder.prepRemaining = 0.01; });
  const quitBtn = document.getElementById('quitBtn');
  if (quitBtn) quitBtn.addEventListener('click', () => {
    if (quitBtn.dataset.armed === '1') { builderQuit(); return; }
    quitBtn.dataset.armed = '1';
    quitBtn.textContent = 'Tap again to confirm quit';
    quitBtn.classList.add('armed');
    setTimeout(() => { quitBtn.dataset.armed = '0'; quitBtn.textContent = 'Quit Workout'; quitBtn.classList.remove('armed'); }, 3000);
  });
}

function renderBuilderDone() {
  const r = builder.runRoutine;
  app.innerHTML = `
    <div class="screen">
      <div class="app-header"><button class="back" id="backBtn">← Home</button><div class="title">Done</div><div class="right"></div></div>
      <div class="done">
        <div class="check">✓ DONE</div>
        <h2>Workout Complete</h2>
        <div class="stats">${escapeHtml(r ? r.name : '')} · ${fmt(builder.totalElapsed)}</div>
        <button class="btn primary" id="backBuilderBtn">Back to Builder</button>
      </div>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', goHome);
  document.getElementById('backBuilderBtn').addEventListener('click', () => { builder.view = 'home'; render(); });
}

/* ---------- Helpers ---------- */
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

/* ====================================================
   INIT
   ==================================================== */
render();
startLoop();

// Pre-warm voices (Chrome quirk)
if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
</script>
</body>
